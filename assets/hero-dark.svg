<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 148" width="880" height="148" role="img" aria-label="Febnawan Fatur Rochman — Web Development, Computer Vision, and Embedded Systems">
  <title>Febnawan Fatur Rochman</title>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes statusPulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.25; transform: scale(1.9); }
      }
      @keyframes waveShiftA {
        0% { transform: translateX(0); }
        100% { transform: translateX(-180px); }
      }
      @keyframes waveShiftB {
        0% { transform: translateX(-90px); }
        100% { transform: translateX(-270px); }
      }
      .pulse-ring {
        transform-box: fill-box;
        transform-origin: center;
        animation: statusPulse 2.8s cubic-bezier(0.32, 0.72, 0, 1) infinite;
      }
      .wave-a { animation: waveShiftA 11s linear infinite; }
      .wave-b { animation: waveShiftA 15s linear infinite; }
      .wave-c { animation: waveShiftB 19s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .pulse-ring, .wave-a, .wave-b, .wave-c { animation: none; }
      }
    </style>
    <linearGradient id="heroWaveFade" x1="490" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="84%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="heroWaveMask">
      <rect x="490" y="10" width="390" height="126" fill="url(#heroWaveFade)"/>
    </mask>
    <clipPath id="heroWaveClip">
      <rect x="490" y="10" width="390" height="126"/>
    </clipPath>
  </defs>

  <text x="0" y="42" class="sans" font-size="29" font-weight="700" fill="#F0F6FC" letter-spacing="-0.8">Febnawan Fatur Rochman</text>
  <text x="0" y="71" class="sans" font-size="14" fill="#8B949E">Web Development · Computer Vision · Embedded Systems</text>

  <circle cx="5" cy="99" r="3.5" fill="#2DD4BF" opacity="0.3" class="pulse-ring"/>
  <circle cx="5" cy="99" r="3.2" fill="#2DD4BF"/>
  <text x="18" y="103" class="mono" font-size="12" fill="#8B949E">Tasikmalaya · Informatics S1 · Thesis 2026</text>

  <g clip-path="url(#heroWaveClip)" mask="url(#heroWaveMask)">
    <path d="M 480 68 C 525 57, 525 57, 570 68 C 615 79, 615 79, 660 68 C 705 57, 705 57, 750 68 C 795 79, 795 79, 840 68 C 885 57, 885 57, 930 68 C 975 79, 975 79, 1020 68 C 1065 57, 1065 57, 1110 68 C 1155 79, 1155 79, 1200 68" fill="none" stroke="#30363D" stroke-width="1.2" opacity="0.9" class="wave-c"/>
    <path d="M 480 78 C 525 62, 525 62, 570 78 C 615 94, 615 94, 660 78 C 705 62, 705 62, 750 78 C 795 94, 795 94, 840 78 C 885 62, 885 62, 930 78 C 975 94, 975 94, 1020 78 C 1065 62, 1065 62, 1110 78 C 1155 94, 1155 94, 1200 78" fill="none" stroke="#8B949E" stroke-width="1.35" opacity="0.5" class="wave-b"/>
    <path d="M 480 74 C 525 50, 525 50, 570 74 C 615 98, 615 98, 660 74 C 705 50, 705 50, 750 74 C 795 98, 795 98, 840 74 C 885 50, 885 50, 930 74 C 975 98, 975 98, 1020 74 C 1065 50, 1065 50, 1110 74 C 1155 98, 1155 98, 1200 74" fill="none" stroke="#2DD4BF" stroke-width="1.6" opacity="0.85" class="wave-a"/>
  </g>

  <line x1="0" y1="147" x2="880" y2="147" stroke="#21262D" stroke-width="1"/>
</svg>
