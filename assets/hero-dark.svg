<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Febnawan Fatur Rochman (Aquarise) — Frontend, Edge AI Vision, and Automotive Systems">
  <title>Febnawan Fatur Rochman (Aquarise)</title>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace; font-variant-numeric: tabular-nums; }
      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(2.2); opacity: 0; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(68px); }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .pulse-ring { transform-origin: 36px 38px; animation: pulseDot 2.2s ease-out infinite; }
      .cursor { animation: cursorBlink 1.1s step-end infinite; }
      .laser-scan { animation: scanY 3.6s ease-in-out infinite; }
      .ecu-trace { stroke-dasharray: 120 120; animation: waveFlow 3.2s linear infinite; }
      .float-ui { animation: floatCard 4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.65"/>
    </pattern>
  </defs>

  <!-- Main Card Frame -->
  <rect width="880" height="300" rx="18" fill="#111621" stroke="#232C3D" stroke-width="1.5"/>

  <!-- Left Swiss Identity Column (x: 0..380) -->
  <g>
    <!-- Live Status Pill -->
    <rect x="24" y="24" width="186" height="28" rx="14" fill="#161D2B" stroke="#232C3D" stroke-width="1"/>
    <circle class="pulse-ring" cx="36" cy="38" r="5" fill="#14B8A6"/>
    <circle cx="36" cy="38" r="4" fill="#14B8A6"/>
    <text x="48" y="42" class="mono" font-size="10.5" font-weight="700" fill="#F8FAFC" letter-spacing="1.2">AVAILABLE · S1 RESEARCH</text>

    <!-- Giant Swiss Foundry Display Typography (Zero Paragraphs!) -->
    <text x="24" y="114" class="sans" font-size="54" font-weight="800" fill="#F8FAFC" letter-spacing="-2.4">Febnawan</text>
    <text x="24" y="168" class="sans" font-size="52" font-weight="800" fill="#14B8A6" letter-spacing="-2.2">Aquarise<tspan class="cursor" fill="#38BDF8">_</tspan></text>

    <!-- Big Clean Role Headline -->
    <text x="26" y="198" class="sans" font-size="15" font-weight="600" fill="#94A3B8">Frontend Craftsman · Edge AI · Silicon Firmware</text>

    <!-- 3 High-Contrast Domain Chips -->
    <g class="mono" font-size="11" font-weight="600">
      <rect x="24" y="216" width="104" height="28" rx="7" fill="rgba(56, 189, 248, 0.14)" stroke="#38BDF8" stroke-width="1"/>
      <text x="76" y="234" text-anchor="middle" fill="#38BDF8">WEB &amp; UI</text>

      <rect x="136" y="216" width="110" height="28" rx="7" fill="rgba(20, 184, 166, 0.14)" stroke="#14B8A6" stroke-width="1"/>
      <text x="191" y="234" text-anchor="middle" fill="#14B8A6">YOLO26 INT8</text>

      <rect x="254" y="216" width="104" height="28" rx="7" fill="#161D2B" stroke="#232C3D" stroke-width="1"/>
      <text x="306" y="234" text-anchor="middle" fill="#F8FAFC">ESP32-S3 ECU</text>
    </g>

    <!-- Bottom Colophon -->
    <text x="26" y="274" class="mono" font-size="11.5" font-weight="600" fill="#64748B">UNSIL INFORMATICS  ·  <tspan fill="#14B8A6">AQUARISE.MY.ID ↗</tspan></text>
  </g>

  <!-- Vertical Architectural Divider -->
  <line x1="384" y1="0" x2="384" y2="300" stroke="#232C3D" stroke-width="1.2"/>

  <!-- Right Animated Blueprint & Multi-System Stage (x: 384..880) -->
  <g>
    <rect x="385" y="1" width="494" height="298" rx="17" fill="#0D111A"/>
    <rect x="385" y="1" width="494" height="298" fill="url(#bp-grid)"/>

    <!-- Blueprint Header Strip -->
    <text x="406" y="28" class="mono" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1.6">STAGE // LIVE SYSTEM TELEMETRY</text>
    <text x="858" y="28" text-anchor="end" class="mono" font-size="10" font-weight="700" fill="#14B8A6">REV 2026.11 · 86 REPOS</text>
    <line x1="385" y1="40" x2="879" y2="40" stroke="#1D2534" stroke-width="1"/>

    <!-- MODULE A: Vision Bounding-Box Radar Stage (Top Left of Stage) -->
    <g transform="translate(404, 54)">
      <rect width="220" height="122" rx="10" fill="#111621" stroke="#232C3D" stroke-width="1.2"/>
      <rect width="220" height="24" rx="10" fill="#161D2B"/>
      <circle cx="14" cy="12" r="3.5" fill="#FB7185"/>
      <circle cx="25" cy="12" r="3.5" fill="#FBBF24"/>
      <circle cx="36" cy="12" r="3.5" fill="#14B8A6"/>
      <text x="208" y="16" text-anchor="end" class="mono" font-size="9.5" font-weight="700" fill="#14B8A6">YOLO26 INT8 · 2.38x</text>

      <!-- Tracked Target Box 1 -->
      <rect x="22" y="38" width="68" height="68" rx="4" fill="rgba(20, 184, 166, 0.14)" stroke="#14B8A6" stroke-width="1.5" stroke-dasharray="4 2"/>
      <rect x="22" y="38" width="54" height="14" rx="2" fill="#14B8A6"/>
      <text x="26" y="48" class="mono" font-size="8.5" font-weight="700" fill="#FFFFFF">ID#07 0.94</text>

      <!-- Tracked Target Box 2 -->
      <rect x="116" y="46" width="80" height="60" rx="4" fill="rgba(56, 189, 248, 0.14)" stroke="#38BDF8" stroke-width="1.5"/>
      <rect x="116" y="46" width="56" height="14" rx="2" fill="#38BDF8"/>
      <text x="120" y="56" class="mono" font-size="8.5" font-weight="700" fill="#FFFFFF">ID#12 0.91</text>

      <!-- Animated Laser Scan Line -->
      <line class="laser-scan" x1="12" y1="36" x2="208" y2="36" stroke="#14B8A6" stroke-width="1.5" opacity="0.85"/>
    </g>

    <!-- MODULE B: Floating Clean Frontend UI Card (Top Right of Stage) -->
    <g class="float-ui" transform="translate(638, 54)">
      <rect width="222" height="122" rx="10" fill="#111621" stroke="#232C3D" stroke-width="1.2"/>
      <text x="16" y="24" class="mono" font-size="9.5" font-weight="700" fill="#38BDF8" letter-spacing="1.2">UI CRAFT // REACT · TS</text>
      <text x="16" y="52" class="sans" font-size="24" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">99.4<tspan font-size="14" fill="#14B8A6">%</tspan></text>
      <text x="104" y="46" class="mono" font-size="10" font-weight="700" fill="#14B8A6">▲ +2.38x CPU</text>
      <text x="104" y="60" class="mono" font-size="9.5" fill="#64748B">OpenVINO IR</text>

      <!-- Mini Spark Bars -->
      <rect x="16" y="88" width="22" height="18" rx="3" fill="#1C2536"/>
      <rect x="44" y="80" width="22" height="26" rx="3" fill="#1C2536"/>
      <rect x="72" y="72" width="22" height="34" rx="3" fill="#38BDF8" opacity="0.55"/>
      <rect x="100" y="66" width="22" height="40" rx="3" fill="#38BDF8" opacity="0.8"/>
      <rect x="128" y="58" width="22" height="48" rx="3" fill="#14B8A6"/>
      <rect x="158" y="78" width="48" height="24" rx="6" fill="rgba(20, 184, 166, 0.14)" stroke="#14B8A6" stroke-width="1"/>
      <text x="182" y="94" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#14B8A6">LIVE</text>
    </g>

    <!-- MODULE C: ESP32-S3 Dual-Core ECU & CAN-Bus Oscilloscope Strip (Bottom Full Stage) -->
    <g transform="translate(404, 190)">
      <rect width="456" height="92" rx="10" fill="#111621" stroke="#232C3D" stroke-width="1.2"/>
      <text x="16" y="22" class="mono" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1.2">ESP32-S3 DUAL-CORE ECU BENCH  ·  IGT/IGW COIL &amp; CAN 500KBPS</text>
      <text x="440" y="22" text-anchor="end" class="mono" font-size="10" font-weight="700" fill="#FBBF24">3,600 RPM</text>

      <!-- Oscilloscope Waveform Path -->
      <path d="M 16 68 L 54 68 L 54 36 L 86 36 L 86 68 L 124 68 L 136 46 L 144 30 L 152 76 L 160 68 L 204 68 L 204 36 L 236 36 L 236 68 L 274 68 L 286 46 L 294 30 L 302 76 L 310 68 L 354 68 L 354 36 L 386 36 L 386 68 L 440 68" fill="none" stroke="#14B8A6" stroke-width="1.5" opacity="0.32"/>
      <path class="ecu-trace" d="M 16 68 L 54 68 L 54 36 L 86 36 L 86 68 L 124 68 L 136 46 L 144 30 L 152 76 L 160 68 L 204 68 L 204 36 L 236 36 L 236 68 L 274 68 L 286 46 L 294 30 L 302 76 L 310 68 L 354 68 L 354 36 L 386 36 L 386 68 L 440 68" fill="none" stroke="#14B8A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
