<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-label="Febnawan Fatur Rochman (Aquarise) — Edge AI, High-Craft Web UI, and Automotive Embedded Systems">
  <title>Febnawan Fatur Rochman (Aquarise) — Engineering Profile</title>
  <desc>Computer Vision and Edge AI researcher, Full-Stack Frontend Engineer, and Automotive Embedded Systems Developer at Universitas Siliwangi.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
      @keyframes pulseRing {
        0% { transform: scale(0.95); opacity: 0.75; }
        70% { transform: scale(2.1); opacity: 0; }
        100% { transform: scale(2.1); opacity: 0; }
      }
      @keyframes fadeSlideUp {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .pulse-ring {
        transform-origin: 904px 48px;
        animation: pulseRing 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .fade-1 { animation: fadeSlideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both; }
      .fade-2 { animation: fadeSlideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.14s both; }
      .fade-3 { animation: fadeSlideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.23s both; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
    <pattern id="swiss-cols" x="44" y="16" width="93.5" height="378" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="77.5" height="378" fill="#FFFFFF" opacity="0.018"/>
    </pattern>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Outer Cool Canvas -->
  <rect width="1200" height="410" rx="24" fill="#0B0D11"/>

  <!-- Unified Surface Panel -->
  <rect x="16" y="16" width="1168" height="378" rx="20" fill="#11141B" stroke="#222734" stroke-width="1.2"/>

  <!-- Subtle 12-Column Swiss Architectural Underlay -->
  <rect x="44" y="16" width="1112" height="378" fill="url(#swiss-cols)"/>

  <!-- Top Running Head & Hairline -->
  <g class="mono" font-size="11" fill="#64748B" letter-spacing="2.2">
    <text x="48" y="52" font-weight="600" fill="#F3F4F6">FEBNAWAN FATUR ROCHMAN</text>
    <text x="275" y="52" fill="#64748B">//  AQUARISE  ·  @FEB027</text>
  </g>

  <!-- Live Status Pill (Top Right) -->
  <g>
    <rect x="886" y="33" width="266" height="30" rx="15" fill="#161B26" stroke="#262F40" stroke-width="1"/>
    <circle class="pulse-ring" cx="904" cy="48" r="5" fill="#14B8A6"/>
    <circle cx="904" cy="48" r="4.2" fill="#14B8A6"/>
    <text x="918" y="52" class="mono" font-size="10.5" font-weight="600" fill="#F3F4F6" letter-spacing="1.2">S1 THESIS · EDGE AI RESEARCH</text>
  </g>

  <line x1="16" y1="78" x2="1184" y2="78" stroke="#1E2330" stroke-width="1"/>

  <!-- Hero Display Typography & Positioning Statement -->
  <g class="sans fade-1">
    <text x="48" y="138" font-size="44" font-weight="700" fill="#F3F4F6" letter-spacing="-1.6">Engineering across neural inference,</text>
    <text x="48" y="186" font-size="44" font-weight="700" fill="#F3F4F6" letter-spacing="-1.6">clean interfaces &amp; <tspan fill="#14B8A6">silicon firmware.</tspan></text>
    <rect x="48" y="205" width="76" height="3.5" rx="1.75" fill="url(#accent-bar)"/>

    <!-- Right Editorial Metadata Block -->
    <g class="mono" font-size="11.5" fill="#9CA3AF">
      <text x="850" y="118" font-size="10" fill="#64748B" letter-spacing="2">AFFILIATION &amp; FOCUS</text>
      <text x="850" y="140" font-weight="600" fill="#F3F4F6">Informatics @ Universitas Siliwangi</text>
      <text x="850" y="160" fill="#9CA3AF">CPU-Only INT8 Quantization (YOLO26)</text>
      <text x="850" y="180" fill="#9CA3AF">Automotive Diagnostics @ Multitech</text>
      <text x="850" y="202" font-weight="600" fill="#14B8A6">aquarise.my.id ↗</text>
    </g>
  </g>

  <!-- Middle Hairline Divider (Unified 3-Column Bento Grid) -->
  <line x1="16" y1="232" x2="1184" y2="232" stroke="#1E2330" stroke-width="1"/>
  <line x1="405" y1="232" x2="405" y2="352" stroke="#1E2330" stroke-width="1"/>
  <line x1="795" y1="232" x2="795" y2="352" stroke="#1E2330" stroke-width="1"/>

  <!-- Column 01: Edge AI & Computer Vision -->
  <g class="fade-2">
