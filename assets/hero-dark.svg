    <text x="48" y="284" class="sans" font-size="17" font-weight="700" fill="#F3F4F6" letter-spacing="-0.3">Sub-8-Bit CPU Vision Pipelines</text>
    <text x="48" y="308" class="sans" font-size="13" fill="#9CA3AF">NMS-free YOLO26/11/10 quantization, OpenVINO</text>
    <text x="48" y="327" class="sans" font-size="13" fill="#9CA3AF">2026.2, NNCF PTQ, ONNX Runtime &amp; TrackEval.</text>
  </g>

  <!-- Column 02: High-Craft Web & Full-Stack -->
  <g class="fade-2">
    <text x="433" y="258" class="mono" font-size="10.5" font-weight="600" fill="#38BDF8" letter-spacing="2">02 // FRONTEND &amp; FULL-STACK WEB</text>
    <text x="433" y="284" class="sans" font-size="17" font-weight="700" fill="#F3F4F6" letter-spacing="-0.3">Swiss &amp; Apple-Grade Web Interfaces</text>
    <text x="433" y="308" class="sans" font-size="13" fill="#9CA3AF">TypeScript, React, Next.js, Svelte, Tailwind CSS,</text>
    <text x="433" y="327" class="sans" font-size="13" fill="#9CA3AF">FastAPI &amp; Bun with restraint-first UI systems.</text>
  </g>

  <!-- Column 03: Embedded & Automotive Electronics -->
  <g class="fade-3">
    <text x="823" y="258" class="mono" font-size="10.5" font-weight="600" fill="#14B8A6" letter-spacing="2">03 // AUTOMOTIVE &amp; EMBEDDED SYSTEMS</text>
    <text x="823" y="284" class="sans" font-size="17" font-weight="700" fill="#F3F4F6" letter-spacing="-0.3">Real-Time ECU &amp; Low-Latency Systems</text>
    <text x="823" y="308" class="sans" font-size="13" fill="#9CA3AF">Dual-Core ESP32-S3 FreeRTOS, MCP2515 CAN-Bus,</text>
    <text x="823" y="327" class="sans" font-size="13" fill="#9CA3AF">ILI9341 TFT telemetry &amp; Rust WASAPI audio.</text>
  </g>

  <!-- Bottom Colophon Strip -->
  <line x1="16" y1="352" x2="1184" y2="352" stroke="#1E2330" stroke-width="1"/>
  <g class="mono" font-size="10.5" fill="#64748B" letter-spacing="1.6">
    <text x="48" y="376">TASIKMALAYA, INDONESIA  ·  UTC+7</text>
    <text x="433" y="376">STACK: PYTHON 3.11 · TS · C++ · RUST</text>
    <text x="1152" y="376" text-anchor="end" fill="#9CA3AF">AQUARISE.MY.ID  ·  REV 2026.11</text>
  </g>
