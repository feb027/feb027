<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 104" width="880" height="104" role="img" aria-label="01 Multitech OS — ECU repair and workshop service web app">
  <title>01 Multitech OS</title>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes rowSlide {
        0%, 100% { transform: translateX(0); opacity: 0.7; }
        50% { transform: translateX(64px); opacity: 1; }
      }
      .ui-slider { animation: rowSlide 4.8s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
      @media (prefers-reduced-motion: reduce) {
        .ui-slider { animation: none; }
      }
    </style>
  </defs>

  <text x="0" y="38" class="mono" font-size="12" fill="#6E7681">01</text>
  <text x="36" y="39" class="sans" font-size="18.5" font-weight="600" fill="#F0F6FC" letter-spacing="-0.35">Multitech OS</text>
  <text x="36" y="61" class="sans" font-size="13.5" fill="#8B949E">ECU repair and workshop service web app</text>
  <text x="36" y="82" class="mono" font-size="11.5" fill="#6E7681">React · TypeScript · FastAPI</text>

  <!-- Minimal unboxed wireframe rows -->
  <g>
    <circle cx="668" cy="24" r="2.2" fill="#30363D"/>
    <circle cx="677" cy="24" r="2.2" fill="#30363D"/>
    <circle cx="686" cy="24" r="2.2" fill="#2DD4BF"/>

    <line x1="666" y1="36" x2="876" y2="36" stroke="#21262D" stroke-width="1"/>
    <rect x="666" y="44" width="54" height="4" rx="2" fill="#30363D"/>
    <rect x="732" y="44" width="96" height="4" rx="2" fill="#21262D"/>

    <line x1="666" y1="56" x2="876" y2="56" stroke="#21262D" stroke-width="1"/>
    <rect x="666" y="63" width="144" height="4" rx="2" fill="#21262D"/>
    <rect x="666" y="63" width="52" height="4" rx="2" fill="#2DD4BF" class="ui-slider"/>

    <line x1="666" y1="76" x2="876" y2="76" stroke="#21262D" stroke-width="1"/>
    <rect x="666" y="82" width="72" height="4" rx="2" fill="#30363D"/>
    <rect x="748" y="82" width="44" height="4" rx="2" fill="#21262D"/>
