<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 124" width="288" height="124" role="img" aria-label="05 Mydria — Diabetic retinopathy screening">
  <title>05 Mydria</title>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes scanOrbit {
        0%, 100% { transform: scale(0.88); opacity: 0.45; }
        50% { transform: scale(1.12); opacity: 1; }
      }
      .scan-ring { transform-box: fill-box; transform-origin: center; animation: scanOrbit 3.4s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
      @media (prefers-reduced-motion: reduce) { .scan-ring { animation: none; opacity: 0.8; } }
    </style>
  </defs>

  <text x="18" y="24" class="mono" font-size="11" fill="#6E7681">05</text>
  <g>
    <circle cx="256" cy="18" r="9" fill="none" stroke="#30363D" stroke-width="1"/>
    <circle cx="256" cy="18" r="5" fill="none" stroke="#2DD4BF" stroke-width="1.3" stroke-dasharray="6 3" class="scan-ring"/>
    <circle cx="256" cy="18" r="1.8" fill="#2DD4BF"/>
  </g>

  <text x="18" y="50" class="sans" font-size="17" font-weight="600" fill="#F0F6FC" letter-spacing="-0.3">Mydria</text>
  <text x="18" y="71" class="sans" font-size="12.5" fill="#8B949E">Diabetic retinopathy screening</text>
  <text x="18" y="88" class="sans" font-size="12.5" fill="#8B949E">on APTOS 2019 (Grad-CAM++)</text>
  <text x="18" y="110" class="mono" font-size="11" fill="#6E7681">ConvNeXt-V2 · FastAPI · React</text>

  <line x1="287" y1="10" x2="287" y2="112" stroke="#21262D" stroke-width="1"/>
</svg>
