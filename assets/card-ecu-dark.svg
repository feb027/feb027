<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-label="ECU Pattern Generator and ESP32-S3 Dual-Core Ignition Coil Simulator">
  <title>ECU Pattern-Gen &amp; Ignition Coil Simulator S3</title>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace; font-variant-numeric: tabular-nums; }
      @keyframes ckpScroll {
        0% { stroke-dashoffset: 320; }
        100% { stroke-dashoffset: 0; }
      }
      .ckp-wave { stroke-dasharray: 160 160; animation: ckpScroll 3.4s linear infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="880" height="236" rx="16" fill="#111621" stroke="#232C3D" stroke-width="1.5"/>

  <!-- Left Identity Panel -->
  <g>
    <text x="28" y="42" class="mono" font-size="11" font-weight="700" fill="#14B8A6" letter-spacing="1.6">02 // AUTOMOTIVE &amp; EMBEDDED</text>
    <text x="28" y="88" class="sans" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="-1.2">ECU Bench S3</text>
    <text x="28" y="116" class="sans" font-size="15.5" font-weight="600" fill="#94A3B8">ESP32-S3 Ignition &amp; CAN Synthesizer</text>

    <g transform="translate(28, 138)">
      <rect width="136" height="36" rx="8" fill="#161D2B" stroke="#232C3D" stroke-width="1"/>
      <text x="12" y="15" class="mono" font-size="9" fill="#64748B">DUAL-CORE RTOS</text>
      <text x="12" y="29" class="mono" font-size="11.5" font-weight="700" fill="#14B8A6">1 µs ISR Pulse</text>

      <rect x="146" y="0" width="142" height="36" rx="8" fill="#161D2B" stroke="#232C3D" stroke-width="1"/>
      <text x="158" y="15" class="mono" font-size="9" fill="#64748B">TELEMETRY</text>
      <text x="158" y="29" class="mono" font-size="11.5" font-weight="700" fill="#F8FAFC">CAN 500 kbps</text>
    </g>

    <g class="mono" font-size="10.5" font-weight="600" fill="#64748B">
      <text x="28" y="206">C++ FREERTOS  ·  ESP32-S3  ·  MCP2515  ·  ILI9341 ↗</text>
    </g>
  </g>

  <line x1="344" y1="0" x2="344" y2="236" stroke="#232C3D" stroke-width="1.2"/>

  <!-- Right Product Stage: Oscilloscope & Trigger Wheel Waveform Stage -->
  <g transform="translate(364, 18)">
    <rect width="496" height="200" rx="12" fill="#0D111A" stroke="#232C3D" stroke-width="1.2"/>

    <!-- Top Telemetry Readout Strip -->
    <rect x="14" y="12" width="146" height="44" rx="8" fill="#111621" stroke="#232C3D" stroke-width="1"/>
    <text x="26" y="28" class="mono" font-size="9.5" fill="#64748B">ENGINE SPEED</text>
    <text x="26" y="47" class="mono" font-size="18" font-weight="800" fill="#14B8A6">3,450 <tspan font-size="11">RPM</tspan></text>

    <rect x="170" y="12" width="146" height="44" rx="8" fill="#111621" stroke="#232C3D" stroke-width="1"/>
    <text x="182" y="28" class="mono" font-size="9.5" fill="#64748B">COIL DWELL TIME</text>
    <text x="182" y="47" class="mono" font-size="18" font-weight="800" fill="#38BDF8">2.85 <tspan font-size="11">ms</tspan></text>

    <rect x="326" y="12" width="156" height="44" rx="8" fill="#111621" stroke="#232C3D" stroke-width="1"/>
    <text x="338" y="28" class="mono" font-size="9.5" fill="#64748B">WHEEL PATTERN</text>
    <text x="338" y="47" class="mono" font-size="16" font-weight="800" fill="#FBBF24">36-2 CKP + CMP</text>

    <!-- Dual-Channel Digital Logic Analyzer & Ignition Stage -->
    <rect x="14" y="66" width="468" height="120" rx="8" fill="#111621" stroke="#232C3D" stroke-width="1"/>

    <!-- Channel 1: CKP 36-2 Crankshaft Trigger Teeth -->
    <text x="26" y="84" class="mono" font-size="9.5" font-weight="700" fill="#38BDF8">CH1 · CKP 36-2 CRANK TRIGGER</text>
    <path d="M 26 112 L 42 112 L 42 94 L 56 94 L 56 112 L 70 112 L 70 94 L 84 94 L 84 112 L 98 112 L 98 94 L 112 94 L 112 112 L 126 112 L 126 94 L 140 94 L 140 112 L 182 112 L 182 94 L 196 94 L 196 112 L 210 112 L 210 94 L 224 94 L 224 112 L 238 112 L 238 94 L 252 94 L 252 112 L 266 112 L 266 94 L 280 94 L 280 112 L 322 112 L 322 94 L 336 94 L 336 112 L 350 112 L 350 94 L 364 94 L 364 112 L 378 112 L 378 94 L 392 94 L 392 112 L 406 112 L 406 94 L 420 94 L 420 112 L 468 112" fill="none" stroke="#38BDF8" stroke-width="1.8" opacity="0.85"/>

    <!-- Channel 2: IGT / IGW Ignition Coil Dwell & Discharge -->
    <text x="26" y="136" class="mono" font-size="9.5" font-weight="700" fill="#14B8A6">CH2 · IGT COIL DWELL &amp; SPARK DISCHARGE</text>
    <path d="M 26 170 L 110 170 L 126 146 L 138 138 L 142 178 L 148 164 L 154 170 L 250 170 L 266 146 L 278 138 L 282 178 L 288 164 L 294 170 L 390 170 L 406 146 L 418 138 L 422 178 L 428 164 L 434 170 L 468 170" fill="none" stroke="#14B8A6" stroke-width="1.5" opacity="0.35"/>
    <path class="ckp-wave" d="M 26 170 L 110 170 L 126 146 L 138 138 L 142 178 L 148 164 L 154 170 L 250 170 L 266 146 L 278 138 L 282 178 L 288 164 L 294 170 L 390 170 L 406 146 L 418 138 L 422 178 L 428 164 L 434 170 L 468 170" fill="none" stroke="#14B8A6" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
