<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 126 28" width="126" height="28" role="img" aria-label="repositories">
  <title>repositories</title>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes navSweep {
        0%, 60%, 100% { transform: scaleX(0.18); opacity: 0.25; }
        25% { transform: scaleX(1); opacity: 0.95; }
      }
      @keyframes dotBreathe {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.35; }
      }
      .nav-line {
        transform-box: fill-box;
        transform-origin: left center;
        animation: navSweep 4.8s cubic-bezier(0.32, 0.72, 0, 1) infinite;
        animation-delay: 1.05s;
      }
      .nav-dot {
        animation: dotBreathe 2.6s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .nav-line { animation: none; opacity: 0.45; transform: scaleX(1); }
        .nav-dot { animation: none; }
      }
    </style>
  </defs>

  
  <text x="8" y="17" class="mono" font-size="11.5" fill="#57606A">repositories <tspan fill="#0F766E" font-size="10.5">↗</tspan></text>
  <line x1="8" y1="22" x2="118" y2="22" stroke="#0F766E" stroke-width="1" class="nav-line"/>
  
</svg>
