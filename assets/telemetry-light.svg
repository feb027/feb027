<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 296" width="1200" height="296" role="img" aria-label="Live System Stage &amp; Engineering Telemetry — YOLO26 INT8 Benchmark, ESP32-S3 ECU Waveform, and GitHub Metrics">
  <title>Engineering Telemetry &amp; System Stage</title>
  <desc>Three-stage interactive vector telemetry card showing YOLO26 CPU-only INT8 quantization benchmarks, ESP32-S3 Dual-Core ECU ignition pulse synthesis, and live GitHub contribution metrics.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
      @keyframes scanWave {
        0% { stroke-dashoffset: 360; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes barBreath {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.72; }
      }
      .ecu-wave {
        stroke-dasharray: 180 180;
        animation: scanWave 4.5s linear infinite;
      }
      .live-bar {
        animation: barBreath 2.8s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
    <linearGradient id="wave-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Outer Canvas & Unified Panel -->
  <rect width="1200" height="296" rx="22" fill="#F5F5F7"/>
  <rect x="16" y="12" width="1168" height="272" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- Panel Header Bar -->
  <text x="44" y="42" class="mono" font-size="10.5" font-weight="600" fill="#6E6E73" letter-spacing="2">SYSTEM TELEMETRY  //  LIVE BENCHMARKS &amp; REPOSITORY METRICS</text>
  <text x="1156" y="42" text-anchor="end" class="mono" font-size="10.5" fill="#0F766E" letter-spacing="1.4">● SYNCED 2026-11-22</text>
  <line x1="16" y1="56" x2="1184" y2="56" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Vertical Hairline Dividers -->
  <line x1="416" y1="56" x2="416" y2="284" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="808" y1="56" x2="808" y2="284" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ======================================================================= -->
  <!-- STAGE 01: YOLO26 INT8 CPU-ONLY QUANTIZATION BENCHMARK (x: 44 -> 388)    -->
  <!-- ======================================================================= -->
  <g>
    <text x="44" y="82" class="mono" font-size="10" font-weight="600" fill="#0F766E" letter-spacing="1.8">STAGE 01 · CPU-ONLY EDGE AI (102/104 RUNS)</text>
    <text x="44" y="105" class="sans" font-size="15.5" font-weight="700" fill="#1D1D1F" letter-spacing="-0.3">YOLO26 INT8 PTQ vs FP32 Baseline</text>

    <!-- Metric Row 1: OpenVINO INT8 Speedup -->
    <text x="44" y="133" class="mono" font-size="11" fill="#4B5563">OpenVINO 2026.2 INT8 (CPU)</text>
    <text x="388" y="133" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#0F766E">2.38x FASTER</text>
    <rect x="44" y="141" width="344" height="7" rx="3.5" fill="#E2E8F0"/>
    <rect class="live-bar" x="44" y="141" width="296" height="7" rx="3.5" fill="#0F766E"/>

    <!-- Metric Row 2: Model Footprint Compression -->
    <text x="44" y="171" class="mono" font-size="11" fill="#4B5563">Weight Footprint (FP32 → INT8)</text>
    <text x="388" y="171" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#0071E3">3.74x SMALLER</text>
    <rect x="44" y="179" width="344" height="7" rx="3.5" fill="#E2E8F0"/>
    <rect x="44" y="179" width="268" height="7" rx="3.5" fill="#0071E3"/>

    <!-- Metric Row 3: Counting Accuracy (1 - nMAE) -->
    <text x="44" y="209" class="mono" font-size="11" fill="#4B5563">People Counting Stability (MOT20)</text>
    <text x="388" y="209" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#1D1D1F">ΔnMAE &lt; 0.25%</text>
    <rect x="44" y="217" width="344" height="7" rx="3.5" fill="#E2E8F0"/>
    <rect x="44" y="217" width="324" height="7" rx="3.5" fill="#6E6E73"/>

    <!-- Bottom Chip Strip -->
    <rect x="44" y="240" width="344" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="56" y="257" class="mono" font-size="10" fill="#6E6E73">TENSOR: [1,300,6] NMS-FREE  ·  DEV: i5-12400F (NO GPU)</text>
  </g>

  <!-- ======================================================================= -->
  <!-- STAGE 02: ESP32-S3 AUTOMOTIVE ECU & CAN-BUS STAGE (x: 440 -> 784)       -->
  <!-- ======================================================================= -->
  <g>
    <text x="440" y="82" class="mono" font-size="10" font-weight="600" fill="#0071E3" letter-spacing="1.8">STAGE 02 · EMBEDDED SILICON &amp; CAN-BUS</text>
    <text x="440" y="105" class="sans" font-size="15.5" font-weight="700" fill="#1D1D1F" letter-spacing="-0.3">ESP32-S3 Dual-Core ECU Pulse Synthesis</text>

    <!-- Oscilloscope Stage Box -->
    <rect x="440" y="118" width="344" height="106" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Subtle Oscilloscope Grid Lines -->
    <line x1="440" y1="145" x2="784" y2="145" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="440" y1="171" x2="784" y2="171" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="440" y1="197" x2="784" y2="197" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="526" y1="118" x2="526" y2="224" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="612" y1="118" x2="612" y2="224" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="698" y1="118" x2="698" y2="224" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Animated Ignition / CAN Dwell Waveform -->
    <path d="M 452 195 L 480 195 L 480 142 L 508 142 L 508 195 L 542 195 L 552 162 L 560 132 L 568 205 L 576 195 L 616 195 L 616 142 L 644 142 L 644 195 L 678 195 L 688 162 L 696 132 L 704 205 L 712 195 L 772 195 L 772 214 L 452 214 Z" fill="url(#wave-fill)"/>
    <path d="M 452 195 L 480 195 L 480 142 L 508 142 L 508 195 L 542 195 L 552 162 L 560 132 L 568 205 L 576 195 L 616 195 L 616 142 L 644 142 L 644 195 L 678 195 L 688 162 L 696 132 L 704 205 L 712 195 L 772 195" fill="none" stroke="#0F766E" stroke-width="1.6" opacity="0.45"/>
    <path class="ecu-wave" d="M 452 195 L 480 195 L 480 142 L 508 142 L 508 195 L 542 195 L 552 162 L 560 132 L 568 205 L 576 195 L 616 195 L 616 142 L 644 142 L 644 195 L 678 195 L 688 162 L 696 132 L 704 205 L 712 195 L 772 195" fill="none" stroke="#0F766E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="452" y="135" class="mono" font-size="9.5" fill="#6E6E73">CH1: IGT/IGW COIL DWELL</text>
    <text x="772" y="135" text-anchor="end" class="mono" font-size="9.5" fill="#0F766E">CAN 500kbps · MCP2515</text>

    <!-- Bottom Chip Strip -->
    <rect x="440" y="240" width="344" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="452" y="257" class="mono" font-size="10" fill="#6E6E73">FREERTOS CORE 0: ILI9341 SPI  ·  CORE 1: HARDWARE ISR</text>
  </g>

  <!-- ======================================================================= -->
  <!-- STAGE 03: LIVE GITHUB TELEMETRY & STACK MATRIX (x: 836 -> 1152)         -->
  <!-- ======================================================================= -->
  <g>
    <text x="836" y="82" class="mono" font-size="10" font-weight="600" fill="#0F766E" letter-spacing="1.8">STAGE 03 · GITHUB REPOSITORY TELEMETRY</text>

    <!-- 3 Key KPI Figures (Tabular Monospace) -->
    <g>
      <text x="836" y="104" class="mono" font-size="10" fill="#6E6E73">CONTRIBUTIONS (12M)</text>
      <text x="836" y="132" class="mono" font-size="26" font-weight="700" fill="#1D1D1F">1,697</text>

      <text x="992" y="104" class="mono" font-size="10" fill="#6E6E73">REPOSITORIES</text>
      <text x="992" y="132" class="mono" font-size="26" font-weight="700" fill="#1D1D1F">86 <tspan font-size="12" font-weight="500" fill="#6E6E73">(50 PUB)</tspan></text>
    </g>

    <!-- Language Distribution Bar -->
    <text x="836" y="166" class="mono" font-size="10" fill="#6E6E73" letter-spacing="1.2">LANGUAGE DISTRIBUTION ACROSS WORKSPACES</text>
    <rect x="836" y="176" width="117" height="8" rx="2" fill="#0F766E"/>
    <rect x="955" y="176" width="79" height="8" rx="2" fill="#0071E3"/>
    <rect x="1036" y="176" width="54" height="8" rx="2" fill="#475569"/>
    <rect x="1092" y="176" width="54" height="8" rx="2" fill="#94A3B8"/>

    <!-- Legend Grid -->
    <g class="mono" font-size="10.5" fill="#4B5563">
      <circle cx="842" cy="204" r="4" fill="#0F766E"/>
      <text x="852" y="208">Python 38%</text>

      <circle cx="996" cy="204" r="4" fill="#0071E3"/>
      <text x="1006" y="208">TS / JS 26%</text>

      <circle cx="842" cy="224" r="4" fill="#475569"/>
      <text x="852" y="228">C++ / Rust 18%</text>

      <circle cx="996" cy="224" r="4" fill="#94A3B8"/>
      <text x="1006" y="228">Web / TeX 18%</text>
    </g>

    <!-- Bottom Chip Strip -->
    <rect x="836" y="240" width="316" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="848" y="257" class="mono" font-size="10" fill="#6E6E73">COMMITS: 1290 PUB + 369 PRIV  ·  SELF-HOSTED SVG</text>
  </g>
</svg>
